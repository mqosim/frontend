# MFIN production web server: Vue SPA + /api/ reverse proxy.
# Copied to /etc/nginx/conf.d/default.conf by the frontend Dockerfile.

# Docker's embedded DNS resolver (127.0.0.11) for the upstream hostname.
# valid=10s plus the variable form of proxy_pass below make Nginx re-resolve
# the backend at request time, so recreating the backend container does not
# leave this one proxying to a stale IP until restart. Resolution failing at
# config-load time is not an error — that happens at request time.
resolver 127.0.0.11 valid=10s ipv6=off;

# Honor the upstream TLS terminator's forwarded scheme (Caddy, see
# deploy/README.md) for X-Forwarded-Proto. Only the literal value "https" is
# trusted; without the header the variable falls back to $scheme.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The backend rejects request bodies over 32 MiB; leave headroom for
    # proxy framing overhead so the limit is decided by the backend alone.
    client_max_body_size 34m;

    # Do not advertise version/platform in the Server header or error pages.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Container healthcheck: static answer, no backend dependency, no logs.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API proxy. The variable form of proxy_pass is what triggers runtime DNS
    # via the resolver above; a literal hostname would be resolved once at
    # startup and cached forever. proxy_pass carries NO URI part, so the
    # request path is forwarded unchanged — /api/v1/... must stay /api/v1/...
    # (a trailing slash on proxy_pass would strip /api/ and break every
    # backend route). Cookies are passed through untouched: refresh cookies
    # are Secure; SameSite=Strict and must never be rewritten.
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Content-hashed Vite bundles: immutable, cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fonts ship with fixed filenames (not content-hashed): cache a week.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vendored E-IMZO integration scripts: cache briefly.
    location /e-imzo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The vendored E-IMZO tree carries a developer README — never serve it.
    location = /e-imzo/README.md {
        return 404;
    }

    # theme-init.js applies the saved theme before first paint; the filename
    # is not hashed, so revalidate on every load instead of risking a stale
    # theme flash after a deployment.
    location = /theme-init.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The SPA shell must never be cached aggressively: new deployments change
    # index.html while the hashed /assets/ it references stay valid forever.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: unknown paths render index.html (client-side router), but
    # a missing asset-like path must be a real 404, not an HTML document that
    # fails to parse.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($uri ~* "\.(js|mjs|css|map|json|xml|txt|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot|wasm)$") {
            return 404;
        }
        try_files /index.html =404;
    }

    # Compress text-based responses only; woff2 and images are already
    # compressed formats.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
