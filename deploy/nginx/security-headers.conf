# Shared response security headers. Included at server level and RE-included
# in any location that sets its own add_header: nginx replaces the whole
# inherited header set as soon as a block declares even one header of its own.
#
# Deliberately NOT set here (see deploy/README.md for the full rationale):
#   - Content-Security-Policy: the E-IMZO browser integration loads vendored
#     scripts and connects to the local desktop app over
#     wss://127.0.0.1:64443 / ws://127.0.0.1:64646; an over-restrictive CSP
#     breaks document signing. Pin real origins only after auditing.
#   - Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy: same risk
#     profile, no demonstrated need yet.
#   - Strict-Transport-Security: enable together with TLS termination.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# With TLS terminating on this server (deploy/README.md, option B), uncomment:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
