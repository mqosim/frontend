# CI for the Vue 3 SPA: type-check, lint and production build. No deployment
# and no secrets; the frontend needs none to build.
#
# Runtime notes:
# - Bun 1.4.3 is pinned to the exact version the lockfile was generated with
#   (same pin as the production Dockerfile build stage).
# - The `build` package script runs vue-tsc through Node explicitly, so Node
#   is set up even though everything else runs under Bun. `bun run typecheck`
#   (plain vue-tsc bin) is verified to work under Bun 1.4.3.
#
# Triggers: pushes to prod and pull requests targeting prod.
name: CI

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      # actions/setup-node v5.0.0 - used by the `build` script, which invokes
      # vue-tsc via `node node_modules/vue-tsc/bin/vue-tsc.js`.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      # actions/cache v4.3.0 - Bun's global package cache, keyed on the
      # lockfile. bun install --frozen-lockfile below fails rather than
      # drifting from bun.lock.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
